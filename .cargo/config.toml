# Build speed (see CLAUDE.md). sccache shares compiled crates across every
# worktree and target dir; it cannot cache incremental builds, so those are off.
[build]
rustc-wrapper = "C:/Users/Harvey/AppData/Local/Microsoft/WinGet/Packages/Mozilla.sccache_Microsoft.Winget.Source_8wekyb3d8bbwe/sccache-v0.18.0-x86_64-pc-windows-msvc/sccache.exe"
incremental = false

# rust-lld links much faster than MSVC's link.exe.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
