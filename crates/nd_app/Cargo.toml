[package]
name = "nd_app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HEIFUNG://CITY: Bevy front end"

[[bin]]
name = "heifung_city"
path = "src/main.rs"

[dependencies]
bevy = "0.19.1"
bevy_egui = "0.42"
nd_sim = { workspace = true }
nd_procgen = { workspace = true }
nd_minds = { workspace = true }
# [sound] The synthesised sound engine (cpal underneath, already in the tree via Bevy).
nd_audio = { workspace = true }
glam = { workspace = true }
rand = { workspace = true }
ron = { workspace = true }
serde = { workspace = true }
slotmap = { workspace = true }
# Remote control API (see docs/REMOTE.md): a localhost HTTP server on its own
# thread; `serde_json` for the wire format.
serde_json = "1"
tiny_http = "0.12"
# The window icon is set on the winit window itself (the version Bevy uses).
winit = { version = "0.30", default-features = false }
# [viewer] The building viewer shows a picture from the Inspirations folder
# beside the building (jpg, png and webp).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[dev-dependencies]
# [fonts] The glyph-coverage test reads the fonts' character maps.
ttf-parser = "0.25"
# [chase-cam] Parse and validate the cut-away shader's WGSL (the version Bevy uses).
naga = { version = "29", features = ["wgsl-in"] }

[build-dependencies]
# The exe's icon in Explorer and the taskbar (a Windows resource).
embed-resource = "3"

[features]
# `cargo run --features fast-dev` links Bevy dynamically for quicker rebuilds.
fast-dev = ["bevy/dynamic_linking"]
# [memory] Count heap allocations (live, peak, biggest block) for the
# remote `memory` command. Off in the game: every allocation pays for it.
heap-count = []
