[package]
name = "nd_sim"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Engine-independent city simulation for Neon District"

[dependencies]
serde = { workspace = true }
glam = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
slotmap = { workspace = true }
ron = { workspace = true }
anyhow = { workspace = true }
geo = "0.30"
# [saves] Saves gzip-compressed (zlib-rs: fast, pure Rust).
flate2 = { version = "1.1", features = ["zlib-rs"] }

[features]
# Section timings (`prof!`) for examples/perf_probe.rs; off in the game.
profile = []

[[example]]
name = "perf_probe"
required-features = ["profile"]

[dev-dependencies]
nd_minds = { workspace = true }
