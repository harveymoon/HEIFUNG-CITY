[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = ""

[workspace.dependencies]
nd_sim = { path = "crates/nd_sim" }
nd_procgen = { path = "crates/nd_procgen" }
nd_minds = { path = "crates/nd_minds" }

serde = { version = "1", features = ["derive"] }
ron = "0.12"
glam = { version = "0.32", features = ["serde"] }
rand = "0.9"
rand_chacha = { version = "0.9", features = ["serde"] }
noise = "0.9"
slotmap = { version = "1", features = ["serde"] }
anyhow = "1"

# Bevy compiles slowly unoptimised; keep deps optimised even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

# Optimised like release but quick to build: for tests and agents' test
# instances (`cargo test --profile fast`). The playable exe stays on release.
[profile.fast]
inherits = "release"
codegen-units = 16
lto = false
